# Dogfood: when CI fails, whatbroke explains the failure on the pull request.
name: whatbroke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  explain:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-26.04
    steps:
      # This repo's own action.yml (from main), so there's no tag or SHA to pin.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
